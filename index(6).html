<title>The Stage Cafe &amp; Cake Bar | Digital Menu</title>
<style>
:root{--navy:#082b52;--blue:#1265a8;--sky:#eaf4fc;--ink:#172536;--muted:#64748b;--line:#e5edf5;--cream:#fffaf1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
header{background:linear-gradient(135deg,#061426,#0b3760);color:white;padding:28px 16px 24px;text-align:center;border-bottom:4px solid #d5ad62}
.logo{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#c7e6ff}
.brand{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.brand-mark{width:82px;height:82px;border-radius:50%;border:3px solid white;display:grid;place-items:center;background:#111;color:#fff;font-family:Georgia,serif;font-size:12px;text-align:center;line-height:1.2;padding:8px}
h1{font-family:Georgia,serif;font-size:clamp(30px,6vw,48px);margin:10px 0 4px}header p{margin:0;color:#d6eaff}
.wrap{max-width:1050px;margin:auto;padding:20px 15px 50px}
.tools{position:sticky;top:0;background:#f4f8fc;padding:10px 0;z-index:2}
input{width:100%;padding:14px 16px;border:1px solid #cbd9e8;border-radius:12px;font-size:16px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1265a822}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
nav button{white-space:nowrap;border:1px solid #cbd9e8;background:white;color:var(--navy);padding:9px 14px;border-radius:22px;font-weight:700;cursor:pointer}
nav button.active,nav button:hover{background:var(--blue);color:white;border-color:var(--blue)}
.section{margin:22px 0 28px;scroll-margin-top:145px}.section h2{font-size:21px;color:var(--navy);border-bottom:2px solid #cfe3f5;padding-bottom:10px;margin:0 0 12px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.item{background:white;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 12px #173b5b0a;min-height:104px}
.item-photo{width:104px;height:82px;flex:0 0 104px;object-fit:cover;border-radius:9px;background:#eaf1f7}
.item-info{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;padding:0 4px}
.name{font-weight:700;line-height:1.35}.desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.price{white-space:nowrap;font-weight:800;color:var(--blue);font-size:14px;margin:4px 0}
footer{text-align:center;color:#dcecff;background:var(--navy);padding:26px 10px;font-size:13px;border-top:3px solid #d5ad62}
.empty{text-align:center;padding:35px;color:var(--muted);display:none}
@media(max-width:520px){.brand-mark{width:66px;height:66px}.brand{gap:10px}.wrap{padding-left:12px;padding-right:12px}.items{grid-template-columns:1fr}.section h2{font-size:19px}.item{min-height:96px;gap:10px}.item-photo{width:92px;height:76px;flex-basis:92px}.price{font-size:13px}}
</style>
</head>

const menuEl=document.getElementById('menu'), nav=document.getElementById('categories');
const search=document.getElementById('search'), empty=document.getElementById('empty');
let active='All';
function render(){
 const q=search.value.trim().toLowerCase();
 nav.innerHTML='';
 ['All',...menu.map(x=>x[0])].forEach(cat=>{
  const b=document.createElement('button');b.type='button';b.textContent=cat;b.className=active===cat?'active':'';
  b.onclick=()=>{active=cat;render();};nav.appendChild(b);
 });
 menuEl.innerHTML='';let count=0;
 menu.forEach(([cat,items])=>{
  if(active!=='All'&&active!==cat)return;
  const found=items.filter(([n,p,d=''])=>(n+' '+d+' '+cat).toLowerCase().includes(q));
  if(!found.length)return;count+=found.length;
  const sec=document.createElement('section');sec.className='section';
  const h=document.createElement('h2');h.textContent=cat;sec.appendChild(h);
  const grid=document.createElement('div');grid.className='items';
  found.forEach(([name,price,desc])=>{
   const card=document.createElement('article');card.className='item';
   const photo=document.createElement('img');photo.className='item-photo';photo.loading='lazy';
   photo.alt=name+' photo';photo.src=itemImages[name]||categoryImages[cat]||'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=480&q=80';
   photo.onerror=()=>{photo.style.display='none';};
   card.appendChild(photo);
   const left=document.createElement('div');left.className='item-info';
   const nm=document.createElement('div');nm.className='name';nm.textContent=name;left.appendChild(nm);
   if(desc){const de=document.createElement('div');de.className='desc';de.textContent=desc;left.appendChild(de);}
   const pr=document.createElement('div');pr.className='price';pr.textContent='Rs. '+Number(price).toLocaleString('en-LK')+' /=';
   card.append(left,pr);grid.appendChild(card);
  });
  sec.appendChild(grid);menuEl.appendChild(sec);
 });
 empty.style.display=count?'none':'block';
}
search.addEventListener('input',render);render();
</script>
